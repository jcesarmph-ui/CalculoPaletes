# Ficha do projeto: nome, versão do Python, bibliotecas e configuração das ferramentas.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calculo_paletes"
dynamic = ["version"]  # vem de src/calculo_paletes/__init__.py (__version__)
description = "Calculadora de paletes de chapas e trapézios: pilhas, alturas, fita, plástico e peso"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",     # interface gráfica
]

[project.optional-dependencies]
# Ferramentas só de desenvolvimento (não vão para o .exe)
dev = [
    "pytest>=8.0",      # testes automáticos
    "ruff>=0.6",        # verificação de estilo e erros
    "pyinstaller>=6.0", # geração do .exe
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "calculo_paletes.__version__"}

[tool.pytest.ini_options]
# dados/testes/ = testes com os números da planilha real (fora do Git; só roda neste PC)
testpaths = ["tests", "dados/testes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = erros básicos, I = ordem dos imports, B = armadilhas comuns, UP = sintaxe moderna
select = ["E", "F", "I", "B", "UP"]
